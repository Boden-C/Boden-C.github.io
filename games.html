<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Games portfolio showcase" />
        <meta name="theme-color" content="#0A091A" />
        <title>Games | Portfolio</title>
        <link rel="icon" href="data:," />
        <style>
            :root {
                --bg1: #0a091a;
                --bg2: #0d0c15;
                --bg3: #0e0e0e;
                --accent1: #a389f4;
                --accent2: #6f6ef6;
                --accent3: #55a2f2;
                --accent4: #7ad1f5;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
                color: #fff;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }
            h1 {
                font-size: clamp(2rem, 5vw, 4rem);
                margin-bottom: 2rem;
                background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent4));
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                background-size: 200% 100%;
                animation: gradient 3s ease infinite;
            }
            @keyframes gradient {
                0%,
                100% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
            }
            nav {
                margin-top: 2rem;
            }
            a {
                color: var(--accent3);
                text-decoration: none;
                padding: 0.75rem 1.5rem;
                border: 1px solid var(--accent3);
                border-radius: 0.5rem;
                transition: all 0.3s ease;
            }
            a:hover,
            a:focus-visible {
                background: var(--accent3);
                color: var(--bg1);
                box-shadow: 0 0 20px rgba(85, 162, 242, 0.5);
            }
        </style>
    </head>
    <body>
        <main role="main">
            <h1>Games</h1>
            <p>Games content coming soon...</p>
            <nav role="navigation" aria-label="Main navigation">
                <a href="/" aria-label="Return to home page">Return Home</a>
            </nav>
        </main>
        <script src="/main.js"></script>
        <script>
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, "", "/games");
            }
        </script>
    </body>
</html>
